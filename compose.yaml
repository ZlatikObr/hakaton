# Запуск: docker compose up --build -d  →  http://127.0.0.1:8000
# Остановка: docker compose down  (проверки сохраняются в томе audit-data)
services:
  audit:
    build: .
    ports:
      - "127.0.0.1:${TZ_PORT:-8000}:8000"
    # .env необязателен: без него сервис стартует в локальном режиме без модели.
    env_file:
      - path: .env
        required: false
    environment:
      TZ_DATA_DIR: /data
    volumes:
      - audit-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  audit-data:
