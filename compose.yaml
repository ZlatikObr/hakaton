services:
  audit:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      TZ_DATA_DIR: /data
    volumes:
      - audit-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
volumes:
  audit-data:
