[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tz-audit"
version = "0.1.0"
description = "Local-first procurement specification review with controlled LLM egress"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "python-multipart>=0.0.18,<1", "python-docx>=1.1,<2", "natasha==1.6.0", "defusedxml>=0.7,<1", "pypdf>=6,<7", "phonenumbers>=9,<10", "spacy>=3.8,<3.9", "ru-core-news-md @ https://github.com/explosion/spacy-models/releases/download/ru_core_news_md-3.8.0/ru_core_news_md-3.8.0-py3-none-any.whl"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
tz-audit = "tz_audit.cli:main"

[tool.setuptools.packages.find]
include = ["tz_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
tz_audit = ["static/*", "static/assets/*"]
